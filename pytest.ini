[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers -m "not live"
markers =
    live: Vertex 等への実通信を伴う手動テスト（既定では実行しない。-m live と環境変数が要る）
    allow_network: 外向き通信の遮断を外す（原則使わない。ループバックは常に許可）
    expect_network_block: 遮断が働くこと自体を試すテスト（遮断の記録があることを確認して通す）
